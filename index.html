      <span style="font:600 11px 'Hanken Grotesk';letter-spacing:.1em;text-transform:uppercase;color:${CFG.public?'#8A909C':'var(--accInk)'};background:${CFG.public?'rgba(20,23,28,.05)':'color-mix(in srgb,var(--acc) 12%,#fff)'};padding:7px 11px;border-radius:99px;white-space:nowrap">${CFG.public?'Public':'🔒 Private'}</span>
      <nav class="card" style="display:flex;gap:3px;padding:4px;border-radius:12px;box-shadow:none">
        ${nav.map(([l,h,v])=>{const on=cur===v||(v==='home'&&cur==='detail');return `<a href="${h}" class="navi" style="${on?'background:#16181D;color:#fff':'color:#8A909C'}">${l}</a>`;}).join('')}
      </nav>
    </div></header>`;
}

function countdown(){
  const start=new Date(CFG.starts+'T12:00:00Z'), ms=start-new Date();
  if(ms<=0) return 'Season under way';
  const d=Math.floor(ms/864e5);
  return `Kicks off ${new Date(CFG.starts+'T12:00:00Z').toLocaleDateString(undefined,{day:'numeric',month:'long'})} · ${d} day${d===1?'':'s'} to go`;
}

function statusChip(m){
  if(m.revealed) return `<span style="display:inline-flex;width:22px;height:22px;border-radius:6px;background:color-mix(in srgb,var(--acc) 14%,#fff);color:var(--accInk);align-items:center;justify-content:center;font-size:12px;font-weight:800">✓</span>`;
  if(m.locked) return `<span title="Hidden until kick-off" style="font-size:15px">🔒</span>`;
  return `<span style="color:#cdd0d6;font-weight:800">…</span>`;
}

function trow(cod,nm,pv){
  const cell = pv==null?'' : `<span class="mono" style="font-weight:700;font-size:18px;color:var(--accInk)">${pv}</span>`;
  return `<div style="display:grid;grid-template-columns:1fr 44px;gap:8px;align-items:center;padding:7px 0">
    <div style="display:flex;align-items:center;gap:10px;min-width:0"><span class="cod">${esc(cod)}</span><span style="font:700 15px 'Hanken Grotesk';white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(nm)}</span></div>
    <span style="text-align:center">${cell}</span></div>`;
}

function mcard(m){
  const pk=m.revealed&&m.pick?m.pick.split('-'):[null,null];
  const foot = m.revealed
    ? `<div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:9px;border-top:1px solid rgba(20,23,28,.06)"><span class="lab">Model pick</span><span><span class="mono" style="font-weight:700;font-size:16px;color:var(--accInk)">${esc(m.pick)}</span><span style="font:600 11px 'Hanken Grotesk';color:#9aa0ab;margin-left:8px">${m.ev.toFixed(2)} xpts</span></span></div>`
    : (m.locked
        ? `<div style="display:flex;justify-content:center;align-items:center;gap:7px;margin-top:8px;padding-top:9px;border-top:1px solid rgba(20,23,28,.06);font:600 11px 'Hanken Grotesk';color:#9aa0ab">🔒 Pick unlocks at kick-off</div>`
        : `<div style="display:flex;justify-content:center;margin-top:8px;padding-top:9px;border-top:1px solid rgba(20,23,28,.06);font:600 11px 'Hanken Grotesk';color:#c2c6cd">Opens with the matchweek</div>`);
  return `<div onclick="location.hash='#/m/${m.id}'" class="card" style="padding:14px 17px;cursor:pointer">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:9px;margin-bottom:2px;border-bottom:1px solid rgba(20,23,28,.07)">
      <div style="font:600 12px 'Hanken Grotesk';color:#565B66;white-space:nowrap;overflow:hidden;text-overflow:ellipsis"><b style="color:#16181D">${esc(m.round)}</b> · ${esc(m.kd)} · ${esc(m.kt)}</div>${statusChip(m)}</div>
    ${trow(m.hC,m.hN,pk[0])}${trow(m.aC,m.aN,pk[1])}${foot}</div>`;
}

function home(){
  const status=`<div class="card" style="padding:16px 20px;margin:24px 0 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-left:4px solid var(--acc)">
    <div style="width:40px;height:40px;border-radius:11px;background:color-mix(in srgb,var(--acc) 12%,#fff);display:flex;align-items:center;justify-content:center;font-size:20px">⚽</div>
    <div style="flex:1;min-width:180px"><div class="bg" style="font-weight:700;font-size:18px">${esc(countdown())}</div><div style="font:500 12px 'Hanken Grotesk';color:#8A909C;margin-top:2px">${DATA.matches.length} fixtures · ${CFG.rounds} matchweeks${CFG.public?' · picks reveal at kick-off':''}</div></div></div>`;
  const searching=q.length>0;
  let list=DATA.matches.slice();
  if(round!=='ALL' && !searching) list=list.filter(m=>('R'+m.roundNo)===round);
  if(searching) list=list.filter(m=>(m.hN+' '+m.aN+' '+m.hC+' '+m.aC).toLowerCase().includes(q));
  const pills=[{key:'ALL',label:'All',count:DATA.matches.length}].concat(DATA.rounds);
  const pillbar=`<div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin:0 0 22px">${pills.map(r=>{const on=r.key===round&&!searching;return `<div onclick="pick('${r.key}')" class="pill" style="${on?'background:#16181D;color:#fff':'background:#fff;border:1px solid rgba(20,23,28,.1);color:#565B66'}"><span>${esc(r.label)}</span><span class="mono" style="font-size:11px;font-weight:700;${on?'color:#fff;opacity:.7':'color:#b1b6bf'}">${r.count}</span></div>`;}).join('')}</div>`;
  const rnd=round==='ALL'||searching?'All matches':(DATA.rounds.find(r=>r.key===round)||{}).long;
  const head=`<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px"><h2 class="bg" style="font-weight:700;font-size:26px;letter-spacing:-.01em;margin:0">${esc(rnd)}</h2><span style="font:600 12px 'Hanken Grotesk';color:#9aa0ab">${list.length} shown</span></div>`;
  const box=`<div style="position:relative;margin:0 0 18px"><input id="q" value="${esc(q)}" oninput="search(this.value)" placeholder="🔍  Search a club" autocomplete="off" style="width:100%;padding:13px 16px;border:1px solid rgba(20,23,28,.14);border-radius:13px;font:500 15px 'Hanken Grotesk';outline:none;background:#fff">${searching?`<span onclick="search('')" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);cursor:pointer;color:#9aa0ab">✕</span>`:''}</div>`;
  const grid=`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(288px,1fr));gap:15px">${list.map(mcard).join('')||`<div class="card" style="padding:36px;text-align:center;color:#9aa0ab">No matches.</div>`}</div>`;
  return header()+status+box+(searching?'':pillbar)+head+grid;
}

function probBar(o){
  const H=Math.round((o.HOME||0)*100),D=Math.round((o.DRAW||0)*100),A=Math.round((o.AWAY||0)*100);
  const seg=(w,c,t)=>`<div style="width:${w}%;background:${c};display:flex;align-items:center;justify-content:center;color:#fff;font:700 12px 'JetBrains Mono'">${w>=10?t:''}</div>`;
  return `<div style="max-width:560px;margin:20px auto 0"><div style="display:flex;height:30px;border-radius:10px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(20,23,28,.06)">${seg(H,'var(--acc)','1')}${seg(D,'#9aa0ab','X')}${seg(A,'#3a4150','2')}</div>
  <div style="display:flex;justify-content:space-between;margin-top:8px;font:700 12px 'JetBrains Mono'"><span class="acc">1 · ${H}%</span><span style="color:#8A909C">X · ${D}%</span><span style="color:#3a4150">2 · ${A}%</span></div>
  <div style="text-align:center" class="lab">Match result — win probability</div></div>`;
}

function detail(id){
  const m=byId(id); if(!m) return header()+'<p style="margin-top:30px">Not found. <a href="#/">Back</a></p>';
  const back=`<a href="#/" style="display:inline-flex;align-items:center;gap:7px;margin:24px 0 18px;font:600 13px 'Hanken Grotesk';color:#8A909C"><span style="font-size:16px">‹</span> All matches</a>`;
  const drow=(cod,nm)=>`<div style="display:grid;grid-template-columns:1fr;gap:10px;align-items:center;padding:12px 0;border-top:1px solid rgba(20,23,28,.06)"><div style="display:flex;align-items:center;gap:14px"><span class="cod" style="font-size:12px;padding:5px 9px">${esc(cod)}</span><span class="bg" style="font-weight:700;font-size:clamp(18px,3vw,23px);letter-spacing:-.01em">${esc(nm)}</span></div></div>`;
  const headCard=`<section class="card" style="padding:22px clamp(18px,4vw,28px);margin-bottom:18px">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px"><div style="font:600 13px 'Hanken Grotesk';color:#565B66"><b style="color:#16181D">${esc(m.round)}</b> · ${esc(m.kd)} · ${esc(m.kt)}</div>${statusChip(m)}</div>
    ${drow(m.hC,m.hN)}${drow(m.aC,m.aN)}
    ${m.revealed?probBar(m.out):''}</section>`;
  if(m.revealed) return header()+back+headCard+pickCard(m);
  if(m.locked) return header()+back+headCard+lockedCard();
  return header()+back+headCard+`<section class="card" style="padding:38px;text-align:center;color:#8A909C"><div style="font-size:32px">🗓️</div><p style="max-width:420px;margin:12px auto 0;line-height:1.6">This matchweek isn't open yet. The model publishes its pick and probabilities once the round's odds are live.</p></section>`;
}

function pickCard(m){
  const o=m.odds||{}, side=m.outcome==='HOME'?m.hN:(m.outcome==='AWAY'?m.aN:'Draw');
  const stat=(v,l)=>`<div style="text-align:center;padding:14px 8px;background:rgba(20,23,28,.02);border-radius:12px"><div class="mono" style="font-weight:700;font-size:23px;color:var(--accInk)">${v}</div><div class="lab" style="margin-top:6px">${l}</div></div>`;
  return `<section class="card" style="padding:22px clamp(16px,3vw,24px)">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap">
      <h3 class="bg" style="font-weight:700;font-size:18px;letter-spacing:-.01em;margin:0">Model recommendation</h3>
      <div style="display:flex;align-items:baseline;gap:10px"><span class="mono" style="font-weight:700;font-size:30px;color:var(--accInk)">${esc(m.pick)}</span><span style="font:600 12px 'Hanken Grotesk';color:#8A909C">${esc(side)}</span></div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px">
      ${stat(m.ev.toFixed(2),'expected pts')}${stat((m.exact*100).toFixed(1)+'%','exact-score prob')}${stat(m.conf+'%','confidence')}
    </div>
    ${o.home?`<div style="display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-top:16px;font:600 12px 'JetBrains Mono';color:#8A909C"><span class="acc">1 · ${o.home}</span><span>X · ${o.draw}</span><span>2 · ${o.away}</span><span style="color:#c2c6cd">line ${o.total_line}</span></div>`:''}
    <p style="font:500 11px 'Hanken Grotesk';color:#b1b6bf;text-align:center;margin:14px 0 0">The points-optimal scoreline — highest expected points under 3-exact / 1-outcome scoring. Full per-scoreline ranking arrives with the live sync.</p>
  </section>`;
}

function lockedCard(){
  return `<section class="card" style="padding:42px 26px;text-align:center">
    <div style="font-size:38px">🔒</div>
    <h3 class="bg" style="font-weight:700;font-size:22px;letter-spacing:-.01em;margin:14px 0 8px">Hidden until kick-off</h3>
    <p style="max-width:440px;margin:0 auto 20px;font:400 15px/1.65 'Hanken Grotesk';color:#565B66">The model's recommended scoreline and probabilities for this match publish the moment predictions lock at kick-off — kept out of the page until then, so nothing leaks early.</p>
    <a href="${esc(CFG.contact)}" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:8px;background:linear-gradient(150deg,var(--acc),var(--acc2));color:#fff;font:700 14px 'Hanken Grotesk';padding:13px 22px;border-radius:12px;box-shadow:0 8px 20px color-mix(in srgb,var(--acc) 30%,transparent)">Want the picks before the whistle? Get in touch ›</a>
  </section>`;
}

function title(){
  const t=DATA.title, top=t.length?t[0].p:1;
  const rows=t.map((x,i)=>`<div style="display:grid;grid-template-columns:150px 1fr 54px;align-items:center;gap:12px;padding:8px 0">
    <div style="font:600 14px 'Hanken Grotesk';display:flex;gap:8px"><span class="mono" style="color:#c2c6cd;font-size:12px">${i+1}</span>${esc(x.team)}</div>
    <div style="height:9px;background:#eef0f2;border-radius:6px;overflow:hidden"><div style="height:100%;width:${Math.round(x.p/top*100)}%;background:linear-gradient(90deg,var(--acc),var(--acc2));border-radius:6px"></div></div>
    <div class="mono" style="font-size:12px;font-weight:700;text-align:right;color:#8A909C">${(x.p*100).toFixed(1)}%</div></div>`).join('');
  return header()+`<a href="#/" style="display:inline-flex;gap:7px;margin:24px 0 18px;font:600 13px 'Hanken Grotesk';color:#8A909C"><span style="font-size:16px">‹</span> Matches</a>
    <section class="card" style="padding:24px clamp(16px,3vw,26px)">
      <h2 class="bg" style="font-weight:700;font-size:24px;letter-spacing:-.01em;margin:0 0 3px">Title race</h2>
      <p style="font:500 13px 'Hanken Grotesk';color:#8A909C;margin:0 0 18px">Model win probabilities for the trophy · favourite <b class="acc">${esc(t.length?t[0].team:'—')}</b></p>
      ${rows}
    </section>`;
}

function render(){document.getElementById('app').innerHTML={home:home,detail:()=>detail(route().id),title:title}[route().v]();window.scrollTo(0,0);}
window.addEventListener('hashchange',render); render();
</script></body></html>
